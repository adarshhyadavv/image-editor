<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Editor</title>

    <!-- Remix Icon CDN -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>

             <!-- LEFT SECTION: IMAGE EDITOR -->
            <div class="left">

                <!-- Image controls -->
                <div class="top">
                    <label for="image-input" class="btn">
                        Choose image
                        <input type="file" id="image-input" accept="image/*" hidden>
                    </label>
                    <button class="btn" id="reset-btn">Reset</button>
                    <button class="btn" id="download-btn" disabled>Download</button>
                </div>

                <!-- Image preview area -->
                <div class="bottom">
                    <!-- Displayed when no image is selected -->
                    <div class="placeholder">
                        <i class="ri-image-line"></i>
                        <p>No image chosen</p>
                    </div>
                    <!-- Displays the uploaded and edited image -->
                    <canvas id="image-canvas"></canvas>
                </div>

            </div>

            <!-- RIGHT SECTION: FILTER CONTROLS -->
            <div class="right">

                <!-- Filter sliders are generated using JavaScript -->
                <h2>Filters</h2>
                <div class="filters"></div>

                <!-- Preset buttons are generated using JavaScript -->
                <h2>Presets</h2>
                <div class="presets"></div>
            </div>

        </section>
    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
